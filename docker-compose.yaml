version: '3'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - postgis
    networks:
      - sems_network
    env_file:
      - .env
    environment:
      # Bootstrap admin, created on first startup if it doesn't exist yet (only
      # created, never reset — so a password you change in-app survives restarts).
      # Override in .env; CHANGE THE PASSWORD after first login.
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-changeme}
      # Set true when serving behind HTTPS so the session cookie is TLS-only.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # "none" (implies Secure) when the map is embedded as a cross-site iframe,
      # otherwise the browser drops the login cookie inside the frame.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8050:80"
    depends_on:
      - backend
    networks:
      - sems_network
    env_file:
      - .env
    restart: always

  server_reports:
    build:
      context: .
      dockerfile: docker/Dockerfile_server_reports
    depends_on:
      - postgis
    networks:
      - sems_network
    env_file:
      - .env
    restart: always

  postgis:
    image: postgis/postgis
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    networks:
      - sems_network
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    platform: linux/amd64
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - sems_network
    restart: always

volumes:
  postgis_data:
  pgadmin_data:

networks:
  sems_network:
