# The scheme to tell the backend the browser actually used. TLS is normally
# terminated by an outer reverse proxy, so $scheme here is plain "http" and
# using it alone makes the backend build https pages' redirects as http:// --
# which the browser then treats as a cross-origin (scheme differs) request,
# forcing a CORS preflight that the outer proxy answers with its own http->https
# redirect, and preflights may not redirect. Prefer what the outer proxy told
# us; fall back to $scheme when nothing is in front of us.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8052;
        # $http_host, not $host: $host drops the port, so FastAPI's
        # trailing-slash redirects (/api/v1/layers -> /api/v1/layers/) would
        # come back as http://localhost/... and 404 for anyone reaching the
        # map on a non-80 port (the compose default publishes it on 8050).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
