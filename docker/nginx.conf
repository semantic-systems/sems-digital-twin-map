server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8052;
        # $http_host, not $host: $host drops the port, so FastAPI's
        # trailing-slash redirects (/api/v1/layers -> /api/v1/layers/) would
        # come back as http://localhost/... and 404 for anyone reaching the
        # map on a non-80 port (the compose default publishes it on 8050).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
